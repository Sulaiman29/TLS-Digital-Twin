# ============================================
# Docker Compose — Tartu Digital Twin
# ============================================
# Usage:
#   docker compose up        (start all services)
#   docker compose up -d     (start in background)
#   docker compose down      (stop all services)
#   docker compose logs -f   (tail logs)
# ============================================

services:
  # --- MQTT Broker ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dt-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Blockchain (Ganache) ---
  ganache:
    image: trufflesuite/ganache:latest
    container_name: dt-ganache
    command: [ "--deterministic", "--host", "0.0.0.0", "--port", "8545" ]
    ports:
      - "8545:8545"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8545 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- SUMO Publisher (headless) ---
  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    container_name: dt-publisher
    env_file: .env
    environment:
      MQTT_BROKER: mosquitto
      SUMO_MODE: headless
      BLOCKCHAIN_RPC_URL: http://ganache:8545
    depends_on:
      mosquitto:
        condition: service_healthy
      ganache:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  # --- AI Agent (LLM) ---
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: dt-agent
    env_file: .env
    environment:
      MQTT_BROKER: mosquitto
      BLOCKCHAIN_RPC_URL: http://ganache:8545
    depends_on:
      mosquitto:
        condition: service_healthy
      ganache:
        condition: service_healthy
      publisher:
        condition: service_started
    networks:
      - app-network
    restart: on-failure

  # --- Phoenix Dashboard ---
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: dt-dashboard
    ports:
      - "4000:4000"
    environment:
      MQTT_HOST: mosquitto
      PHX_HOST: 0.0.0.0
      PORT: 4000
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

networks:
  app-network:
    driver: bridge
